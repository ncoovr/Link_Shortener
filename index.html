<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Acortador de Enlaces</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 28px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 20px;
      text-align: center;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    input {
      width: 100%;
      padding: 12px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
    }
    input:focus {
      border-color: #6366f1;
    }
    button {
      padding: 12px;
      background: #6366f1;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background: #4f46e5;
    }
    .result {
      margin-top: 20px;
      padding: 12px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      word-break: break-all;
    }
    .result a {
      color: #38bdf8;
    }
    .error {
      margin-top: 15px;
      padding: 10px;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid #ef4444;
      color: #fca5a5;
      border-radius: 6px;
      font-size: 0.85rem;
    }
    .hidden {
      display: none;
    }
  </style>
<link rel="stylesheet" href="/index.css">
</head>
<body>

  <div class="card">
    <h1>Acortador de Enlaces</h1>
    <form id="urlForm" class="form-group">
      <input type="url" id="urlInput" placeholder="https://ejemplo.com/enlace-largo" required />
      <button type="submit" id="submitBtn">Acortar</button>
    </form>

    <div id="errorBox" class="error hidden"></div>

    <div id="resultBox" class="result hidden">
      <span>Enlace generado:</span><br />
      <a id="shortLink" href="#" target="_blank"></a>
    </div>
  </div>

  <script>
    const API_URL = 'http://IP_EC2_AQUI:8000/shorten';

    const form = document.getElementById('urlForm');
    const input = document.getElementById('urlInput');
    const errorBox = document.getElementById('errorBox');
    const resultBox = document.getElementById('resultBox');
    const shortLink = document.getElementById('shortLink');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBox.classList.add('hidden');
      resultBox.classList.add('hidden');

      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ original_url: input.value.trim() })
        });

        if (!response.ok) {
          throw new Error('Error al procesar enlace en el servidor');
        }

        const data = await response.json();
        const base = API_URL.replace('/shorten', '');
        const finalUrl = `${base}/${data.short_code}`;

        shortLink.href = finalUrl;
        shortLink.textContent = finalUrl;
        resultBox.classList.remove('hidden');
      } catch (err) {
        errorBox.textContent = 'Error: No se pudo conectar al servidor o URL inválida.';
        errorBox.classList.remove('hidden');
      }
    });
  </script>
<script type="module" src="/index.tsx"></script>
</body>
</html>
